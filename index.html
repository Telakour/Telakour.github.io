<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <script>
      (function () {
        var supported = ["zh-CN", "ko-KR", "ja-JP"];
        var locale = "zh-CN";
        try {
          var stored = window.localStorage.getItem("trickcal.locale");
          if (supported.indexOf(stored) >= 0) locale = stored;
        } catch (error) {}
        document.documentElement.lang = locale;
        document.documentElement.dataset.locale = locale;
        window.__codexInitialLocale = locale;
        var fonts = {
          "zh-CN": "/fonts/JingNanBoBoHei-Bold-2.ttf",
          "ko-KR": "/fonts/NEXONLv1GothicBold.ttf",
          "ja-JP": "/fonts/RocknRollOne-Regular.ttf"
        };
        var preload = document.createElement("link");
        preload.rel = "preload";
        preload.as = "font";
        preload.type = "font/ttf";
        preload.crossOrigin = "anonymous";
        preload.href = fonts[locale];
        preload.fetchPriority = "high";
        document.head.appendChild(preload);
      })();
    </script>
    <link
      rel="preload"
      as="image"
      href="./home/bg-desktop.jpg"
      media="(min-width: 761px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="./home/bg-mobile.jpg"
      media="(max-width: 760px)"
      fetchpriority="high"
    />
    <link rel="stylesheet" href="./loading-screen/loading-screen.css?v=4" />
    <link rel="preload" as="image" href="./loading-screen/backgrounds/Fairy_Guestroom2_night.webp?v=4" fetchpriority="high" />
    <link rel="preload" as="image" href="./loading-screen/loading-card-pattern.webp?v=4" fetchpriority="high" />
    <link rel="preload" as="image" href="./loading-screen/loading-token.webp?v=4" fetchpriority="high" />
    <script defer src="./loading-screen/spine-webgl.min.js?v=4"></script>
    <script defer src="./loading-screen/loading-spine.js?v=4"></script>
    <style>
      html,
      body,
      #root {
        min-width: 320px;
        min-height: 100%;
        margin: 0;
      }

      body {
        background: #879d72;
      }
    </style>
    <title>教主的旅途</title>
    <script type="module" crossorigin src="./assets/index-DRKvNg8J.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DmYnplrG.css">
  </head>
  <body>
    <div id="root">
      <div class="codex-loading-screen" id="codex-bootstrap-loading" aria-busy="true" style="background-image:url('loading-screen/backgrounds/Fairy_Guestroom2_night.webp?v=4');background-position:center;background-repeat:no-repeat;background-size:cover">
        <div class="codex-loading-card">
          <canvas class="codex-loading-spine" data-codex-loading-spine data-spine-root="https://assets.927927927.xyz/spine" aria-hidden="true"></canvas>
          <div class="codex-loading-content">
            <img class="codex-loading-leaf" src="./loading-screen/loading-token.webp?v=4" alt="" />
            <div class="codex-loading-title">可丽饼正在打扫教团</div>
            <div class="codex-loading-subtitle">资源加载中，请稍候</div>
            <div class="codex-loading-bar is-indeterminate" role="progressbar">
              <div class="codex-loading-bar-fill"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var loadingScreen = document.getElementById("codex-bootstrap-loading");
        if (!loadingScreen) return;
        // HashRouter changes the hash for every in-app route. The loading
        // background must remain stable until the document itself is reloaded.
        var sessionKey = window.location.pathname + window.location.search;
        if (
          window.__codexLoadingBackgroundKey === sessionKey &&
          window.__codexLoadingBackgroundPromise
        ) return;

        window.__codexLoadingBackgroundKey = sessionKey;
        window.__codexLoadingBackgroundUrl = undefined;
        var defaultBackground = new URL("/loading-screen/backgrounds/Fairy_Guestroom2_night.webp?v=4", window.location.href).href;
        function loadBackground(source) {
          return new Promise(function (resolve) {
            var image = new Image();
            var settled = false;
            function finish(value) {
              if (settled) return;
              settled = true;
              resolve(value);
            }
            image.onload = function () {
              if (typeof image.decode === "function") {
                image.decode().catch(function () {}).then(function () { finish(source); });
              } else {
                finish(source);
              }
            };
            image.onerror = function () { finish(null); };
            image.src = source;
            if (image.complete) image.onload();
          });
        }
        window.__codexLoadingBackgroundPromise = fetch("/loading-screen/assets.json?v=4", { cache: "force-cache" })
          .then(function (response) { return response.ok ? response.json() : null; })
          .then(function (manifest) {
            var backgrounds = manifest && manifest.backgrounds;
            if (!Array.isArray(backgrounds) || !backgrounds.length) return loadBackground(defaultBackground);
            window.__codexLoadingBackgroundManifest = backgrounds;
            var relativePath = backgrounds[Math.floor(Math.random() * backgrounds.length)];
            var source = new URL(String(relativePath).replace(/^\/+/, ""), new URL("/loading-screen/", window.location.href)).href;
            return loadBackground(source).then(function (loadedSource) {
              loadedSource = loadedSource || defaultBackground;
              if (window.__codexLoadingBackgroundKey !== sessionKey) return;
              window.__codexLoadingBackgroundUrl = loadedSource;
              loadingScreen.style.backgroundImage = 'url("' + loadedSource.replace(/"/g, "%22") + '")';
              return loadedSource;
            });
          })
          .catch(function () {
            window.__codexLoadingBackgroundUrl = defaultBackground;
            return defaultBackground;
          });
      })();
    </script>
  </body>
</html>
